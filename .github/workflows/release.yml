# Сборка релиза: поменяй номер в файле VERSION — GitHub соберёт архивы для Windows и Linux,
# DMG для Mac и создаст черновик релиза. Опубликовать — кнопкой на странице Releases.
name: Релиз
on:
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "ver=$(tr -d ' \n\r' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Утилиты из IPA_Downloader
        run: |
          curl -fsSL https://github.com/kda2495/IPA_Downloader/archive/refs/heads/main.zip -o ipad.zip
          unzip -q ipad.zip -d /tmp
      - name: Сборка
        run: |
          sudo apt-get install -y llvm >/dev/null
          python3 packaging/build.py "${{ steps.v.outputs.ver }}" /tmp/IPA_Downloader-main dist
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }
  mac:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: NOTES.md, path: repo }
      - run: cp repo/NOTES.md NOTES.md
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Своё окно и DMG
        env: { DK_REQUIRE_WINDOW: "1" }
        run: |
          cd dist
          chmod +x "Собрать DMG.command"
          ./"Собрать DMG.command"
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: Дима Крохобор ${{ needs.build.outputs.ver }}
          draft: true
          body_path: NOTES.md
          files: |
            dist/*.dmg
            dist/*-windows.zip
            dist/*-linux.zip
