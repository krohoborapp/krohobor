# Сборка релиза по тегу v1.2.3: архивы для Windows и Linux, DMG и архив обновления для Mac.
name: Релиз
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Утилиты из IPA_Downloader
        run: |
          curl -fsSL https://github.com/kda2495/IPA_Downloader/archive/refs/heads/main.zip -o ipad.zip
          unzip -q ipad.zip -d /tmp
      - name: Сборка
        run: |
          sudo apt-get install -y llvm >/dev/null
          python3 packaging/build.py "${GITHUB_REF_NAME#v}" /tmp/IPA_Downloader-main dist
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }
  mac:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Своё окно и DMG
        env: { DK_REQUIRE_WINDOW: "1" }
        run: |
          cd dist
          chmod +x "Собрать DMG.command"
          ./"Собрать DMG.command"
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          name: Дима Крохобор ${{ github.ref_name }}
          draft: true
          files: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*-windows.zip
            dist/*-linux.zip
